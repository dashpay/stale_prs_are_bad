# Python's max() and min() keep the first of equal elements; the engine's
# answers depend on which one is kept. Iterator::max and its forms keep the
# last, and so do std::cmp::max and Ord::max between two values; the min
# forms keep the first, but go through the same functions so that there is
# one way to write either.
#
# A Python dict keeps insertion order when a key is deleted; IndexMap's
# swap_remove forms move the last entry into the gap. Use shift_remove.
#
# Python's sorted() and list.sort() are stable: equal keys keep their order.
# The unstable sorts may reorder them. Use sort, sort_by or sort_by_key.
disallowed-methods = [
    { path = "std::iter::Iterator::max", reason = "keeps the last of equals; use pycompat::py_max_by" },
    { path = "std::iter::Iterator::max_by", reason = "keeps the last of equals; use pycompat::py_max_by" },
    { path = "std::iter::Iterator::max_by_key", reason = "keeps the last of equals; use pycompat::py_max_by_key" },
    { path = "std::iter::Iterator::min", reason = "use pycompat::py_min_by, as Python's min is ported everywhere" },
    { path = "std::iter::Iterator::min_by", reason = "use pycompat::py_min_by, as Python's min is ported everywhere" },
    { path = "std::iter::Iterator::min_by_key", reason = "use pycompat::py_min_by_key, as Python's min is ported everywhere" },
    { path = "std::cmp::max", reason = "keeps the second of equals; use pycompat::py_max_by over [a, b]" },
    { path = "std::cmp::max_by", reason = "keeps the second of equals; use pycompat::py_max_by over [a, b]" },
    { path = "std::cmp::max_by_key", reason = "keeps the second of equals; use pycompat::py_max_by_key over [a, b]" },
    { path = "std::cmp::Ord::max", reason = "keeps the second of equals; use pycompat::py_max_by over [a, b]" },
    { path = "indexmap::map::IndexMap::swap_remove", reason = "reorders the map; a Python dict keeps order, use shift_remove" },
    { path = "indexmap::map::IndexMap::swap_remove_entry", reason = "reorders the map; a Python dict keeps order, use shift_remove_entry" },
    { path = "indexmap::map::IndexMap::swap_remove_full", reason = "reorders the map; a Python dict keeps order, use shift_remove_full" },
    { path = "indexmap::map::IndexMap::swap_remove_index", reason = "reorders the map; a Python dict keeps order, use shift_remove_index" },
    { path = "slice::sort_unstable", reason = "may reorder equal elements; Python's sort is stable, use sort" },
    { path = "slice::sort_unstable_by", reason = "may reorder equal elements; Python's sort is stable, use sort_by" },
    { path = "slice::sort_unstable_by_key", reason = "may reorder equal elements; Python's sort is stable, use sort_by_key" },
]
