[package]
name = "pr-hygiene-engine"
version = "0.1.0"
edition = "2021"
description = "The PR-review engine of pr_review/, ported to Rust and held to its conformance corpus"
license = "MIT"
publish = false

# Synchronous and free of I/O: no async runtime, no HTTP client.
[dependencies]
indexmap = "2"
# Without its Unicode tables: `\w`, `\s`, `\d`, `\b` and `(?i)` then fail to
# compile, so every pattern has to use the classes read from Python in
# `pycompat::re` rather than the regex crate's own, newer Unicode data.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
thiserror = "1.0"

[dev-dependencies]
# Reads the golden files, independently of the crate's own JSON reader.
serde_json = "1.0"
