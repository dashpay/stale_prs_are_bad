name: Rust
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The workspace: the analyzer, the service and the engine.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # preserve_order would reorder the service's json! answers and change
      # their ETags; arbitrary_precision breaks numbers under
      # #[serde(flatten)] in src/policy.rs. Either can arrive through any
      # crate's dependency, so the whole workspace's feature set is read.
      - name: serde_json features stay frozen
        run: |
          features=$(cargo tree --workspace --locked -e features -i serde_json)
          if grep -E 'serde_json feature "(preserve_order|arbitrary_precision)"' <<<"$features"; then
            echo "::error::serde_json gained preserve_order or arbitrary_precision"
            exit 1
          fi
      - name: Dashboard page renders data as text only
        run: bash site/check.sh
