name: Shared PR policy
on:
  workflow_call:
    inputs:
      engine_revision:
        description: Full commit SHA matching the reusable workflow reference
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: pr-review-policy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Validate engine revision, policy branch protection and target default branch
        id: target
        env:
          ENGINE_REVISION: ${{ inputs.engine_revision }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['ENGINE_REVISION']):
              raise ValueError('A pinned engine commit is required')

          def api(path):
              return json.loads(subprocess.run(['gh', 'api', path], check=True, capture_output=True, text=True).stdout)

          # Policies are read live from the central default branch, so that branch
          # must be governed by a ruleset before any caller trusts it.
          rules = api('repos/dashpay/stale_prs_are_bad/rules/branches/master')
          kinds = {rule['type']: rule for rule in rules}
          review = kinds.get('pull_request', {}).get('parameters', {})
          if not ({'pull_request', 'non_fast_forward', 'deletion'} <= set(kinds)
                  and review.get('required_approving_review_count', 0) >= 1
                  and review.get('require_code_owner_review') is True):
              raise SystemExit('Central policy branch is not protected by the required ruleset; refusing to read policies')

          repo = os.environ['TARGET_REPOSITORY']
          branch = api(f'repos/{repo}')['default_branch']
          if '\n' in branch or '\r' in branch:
              raise ValueError('Invalid branch name')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'branch={branch}\n')
          PY
      - name: Checkout pinned engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dashpay/stale_prs_are_bad
          ref: ${{ inputs.engine_revision }}
          path: review-engine
          persist-credentials: false
      - name: Checkout live policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dashpay/stale_prs_are_bad
          ref: master
          path: review-policies
          sparse-checkout: policies
          persist-credentials: false
      - name: Checkout target default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.target.outputs.branch }}
          path: review-target
          persist-credentials: false
      - name: Check policy paths and CODEOWNERS against the target tree
        working-directory: review-engine
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_REVIEW_POLICIES_ROOT: ${{ github.workspace }}/review-policies/policies
          PR_REVIEW_REPOSITORY_ROOT: ${{ github.workspace }}/review-target
        run: |
          {
            echo '### Policy configuration'
            python3 -m pr_review.main validate --repo "$TARGET_REPOSITORY" \
              --policies-root "$PR_REVIEW_POLICIES_ROOT" --repository-root "$PR_REVIEW_REPOSITORY_ROOT"
            if python3 -m pr_review.main codeowners --check --repo "$TARGET_REPOSITORY" \
                 --policies-root "$PR_REVIEW_POLICIES_ROOT" --repository-root "$PR_REVIEW_REPOSITORY_ROOT"; then
              echo 'CODEOWNERS matches the policy.'
            else
              echo 'CODEOWNERS differs from the policy; regenerate it with pr_review.rollout.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile with repository-local credentials
        working-directory: review-engine
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_AUTOMATION_ENABLED: ${{ vars.PR_REVIEW_AUTOMATION_ENABLED }}
          PR_REVIEW_POLICIES_ROOT: ${{ github.workspace }}/review-policies/policies
          PR_REVIEW_REPOSITORY_ROOT: ${{ github.workspace }}/review-target
        run: python3 -m pr_review.event >> "$GITHUB_STEP_SUMMARY"
