name: PR Hygiene policy
on:
  workflow_call:
    inputs:
      scope:
        description: 'all reconciles every governed pull request; batch is the sweep'
        type: string
        default: batch
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  # Per pull request, not per repository: one shared group meant every new event
  # cancelled whichever run was already queued for a different pull request.
  # Sweeps use the run id so they never cancel each other either.
  group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  # A group holds one pending run by default and cancels it when the next event
  # arrives, so three events on one pull request inside a run's duration turned
  # it red: a cancelled run renders as a failed check. Queueing them instead
  # keeps every event's work and cancels nothing. Runs for one pull request stay
  # serialised, which is what lets each of them read current state and publish
  # the current answer.
  queue: max
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the engine pin, policy branch protection and target branch
        id: target
        env:
          # job.workflow_* identifies this reusable job, not the caller or a
          # pull request's base branch. github.job_workflow_sha does not exist.
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
          WORKFLOW_REFERENCE: ${{ job.workflow_ref }}
          CALLER_REFERENCE: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          CENTRAL = 'dashpay/stale_prs_are_bad'
          CALLER = '.github/workflows/pr-review-policy.yml'
          REUSABLE = f'{CENTRAL}/.github/workflows/pr-review-reusable.yml'.casefold()
          REF = re.compile(r'[A-Za-z0-9._/-]+')

          def api(path):
              result = subprocess.run(['gh', 'api', path], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f'gh api {path} failed: {result.stderr.strip()[:300]}')
              return json.loads(result.stdout)

          repo = os.environ['TARGET_REPOSITORY']
          engine = os.environ.get('WORKFLOW_REVISION', '')
          reference, _, pin = os.environ.get('WORKFLOW_REFERENCE', '').partition('@')
          if (not re.fullmatch(r'[0-9a-f]{40}', engine)
                  or reference.casefold() != REUSABLE or pin != engine):
              raise SystemExit('The running reusable workflow must identify its full pinned commit SHA')
          caller, _, _ = os.environ.get('CALLER_REFERENCE', '').partition('@')
          if caller.casefold() != f'{repo}/{CALLER}'.casefold():
              raise SystemExit('Unexpected caller workflow path')

          default_branch = api(f'repos/{repo}')['default_branch']
          if not REF.fullmatch(default_branch):
              raise SystemExit('Unsupported branch name')

          # Never infer executable code from the PR's base or a moving branch.
          # A stacked PR can target an old feature branch with a stale caller;
          # the engine must still be the revision of the job GitHub is running.

          # Only a reviewed, merged engine may run with a caller's write token.
          comparison = api(f'repos/{CENTRAL}/compare/master...{engine}')
          if comparison.get('status') not in {'identical', 'behind'}:
              raise SystemExit('The pinned engine is not a commit merged to the central default branch; refusing to run it')

          # Policies are read live from the central default branch, so that branch
          # must be governed by a ruleset before any caller trusts it.
          rules = api(f'repos/{CENTRAL}/rules/branches/master')
          kinds = {rule['type'] for rule in rules}
          reviews = [rule.get('parameters', {}) for rule in rules if rule['type'] == 'pull_request']
          if not ({'pull_request', 'non_fast_forward', 'deletion'} <= kinds
                  and any(review.get('required_approving_review_count', 0) >= 1
                          and review.get('require_code_owner_review') is True for review in reviews)):
              raise SystemExit('Central policy branch is not protected by the required ruleset; refusing to read policies')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'branch={default_branch}\nengine={engine}\n')
          PY
      - name: Checkout pinned engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dashpay/stale_prs_are_bad
          ref: ${{ steps.target.outputs.engine }}
          path: review-engine
          persist-credentials: false
      - name: Checkout live policies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dashpay/stale_prs_are_bad
          ref: master
          path: review-policies
          sparse-checkout: policies
          persist-credentials: false
      # Cloning the governed repository is the slowest step in a run — nine of
      # its twenty seconds on a monorepo — so the scan between sweeps, which is
      # also a schedule, must not pay for it: it is named here rather than
      # matched by event, and a test holds the name to the engine's own.
      #
      # It answers one question: do the
      # policy's area directories still exist. That can only change when a pull
      # request merges, the policies are already checked against a fresh clone
      # of every repository when one is proposed, and the sweeps ask again.
      #
      # Missing paths are reported by validation but do not stop reconciliation.
      # Invalid policy/schema failures fail the job; they must never discover
      # and overwrite every open PR's status from an exception handler.
      - name: Checkout target default branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 * * * *'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.target.outputs.branch }}
          path: review-target
          persist-credentials: false
      - name: Check policy paths and CODEOWNERS against the target tree
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 * * * *'
        working-directory: review-engine
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_REVIEW_POLICIES_ROOT: ${{ github.workspace }}/review-policies/policies
          PR_REVIEW_REPOSITORY_ROOT: ${{ github.workspace }}/review-target
        run: |
          {
            echo '### Policy configuration'
            python3 -m pr_review.main validate --repo "$TARGET_REPOSITORY" \
              --policies-root "$PR_REVIEW_POLICIES_ROOT" --repository-root "$PR_REVIEW_REPOSITORY_ROOT" 2>&1
            if python3 -m pr_review.main codeowners --check --repo "$TARGET_REPOSITORY" \
                 --policies-root "$PR_REVIEW_POLICIES_ROOT" --repository-root "$PR_REVIEW_REPOSITORY_ROOT" 2>&1; then
              echo 'CODEOWNERS matches the policy.'
            else
              echo 'CODEOWNERS differs from the policy; regenerate it with pr_review.rollout.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile with repository-local credentials
        working-directory: review-engine
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_AUTOMATION_ENABLED: ${{ vars.PR_REVIEW_AUTOMATION_ENABLED }}
          PR_REVIEW_SCOPE: ${{ inputs.scope }}
          PR_REVIEW_POLICIES_ROOT: ${{ github.workspace }}/review-policies/policies
          PR_REVIEW_REPOSITORY_ROOT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 * * * *') && format('{0}/review-target', github.workspace) || '' }}
        run: python3 -m pr_review.event >> "$GITHUB_STEP_SUMMARY"
