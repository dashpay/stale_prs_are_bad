name: PR review policy tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: proposed
      - name: Unit tests
        working-directory: proposed
        run: python3 -m unittest discover -s pr_review/tests -v
      - name: Clone the default branch of every governed repository
        # Policies are read live by callers, and a policy naming a directory that
        # does not exist in its repository turns that repository's whole queue
        # into configuration errors. Check paths against the real trees here.
        run: |
          set -euo pipefail
          for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('proposed/policies/repositories.json'))['repositories']))"); do
            git clone --quiet --depth 1 "https://github.com/$repo" "trees/${repo#*/}"
          done
      - name: Validate every registered policy against its tree and generate its packet
        working-directory: proposed
        run: |
          set -euo pipefail
          for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('policies/repositories.json'))['repositories']))"); do
            python3 -m pr_review.main validate --repo "$repo" --repository-root "$GITHUB_WORKSPACE/trees/${repo#*/}"
            python3 -m pr_review.rollout --repo "$repo" --engine-revision "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/packets/${repo#*/}"
          done
      - name: Validate proposed policies with every engine revision still pinned by a caller
        # Callers pick up policy changes immediately but engine changes only when
        # re-pinned, so a policy change must validate with every engine in use.
        run: |
          set -euo pipefail
          revisions=$(python3 -c "import json; print(' '.join(sorted({e['engine_revision'] for e in json.load(open('proposed/policies/repositories.json'))['repositories'] if e['engine_revision']})))")
          if [ -z "$revisions" ]; then
            echo 'No caller pins recorded yet.'
            exit 0
          fi
          for sha in $revisions; do
            git clone --quiet --no-checkout https://github.com/dashpay/stale_prs_are_bad "engine-$sha"
            git -C "engine-$sha" checkout --quiet "$sha"
            for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('proposed/policies/repositories.json'))['repositories']))"); do
              (cd "engine-$sha" && python3 -m pr_review.main validate --repo "$repo" \
                 --policies-root "$GITHUB_WORKSPACE/proposed/policies" --repository-root "$GITHUB_WORKSPACE/trees/${repo#*/}")
            done
          done
      - name: Lint workflows and generated caller workflows
        run: |
          mkdir -p /tmp/actionlint-bin
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash | bash -s 1.7.7 /tmp/actionlint-bin # v1.7.7
          # actionlint 1.7.7 predates github.job_workflow_sha.
          /tmp/actionlint-bin/actionlint -ignore 'property "job_workflow_sha" is not defined' proposed/.github/workflows/*.yml
          find packets -name '*.yml' -exec /tmp/actionlint-bin/actionlint {} +
