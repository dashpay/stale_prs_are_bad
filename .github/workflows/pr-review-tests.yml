name: PR Hygiene tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-context:
    # A real reusable job proves the identity contexts are populated by GitHub;
    # unit fixtures alone cannot catch a nonexistent context evaluating empty.
    uses: ./.github/workflows/pr-review-context-test.yml
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: proposed
      - name: Unit tests
        working-directory: proposed
        run: python3 -m unittest discover -s pr_review/tests -v
      - name: Clone the default branch of every governed repository
        # Policies are read live by callers. Catch missing paths before rollout,
        # instead of discovering them in a repository's reconciliation jobs.
        run: |
          set -euo pipefail
          for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('proposed/policies/repositories.json'))['repositories']))"); do
            git clone --quiet --depth 1 "https://github.com/$repo" "trees/${repo#*/}"
          done
      - name: Validate every registered policy against its tree and generate its packet
        working-directory: proposed
        run: |
          set -euo pipefail
          for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('policies/repositories.json'))['repositories']))"); do
            python3 -m pr_review.main validate --repo "$repo" --repository-root "$GITHUB_WORKSPACE/trees/${repo#*/}"
            python3 -m pr_review.rollout --repo "$repo" --engine-revision "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/packets/${repo#*/}"
          done
      - name: Check required_bots against each repository's CodeRabbit setting
        run: python3 proposed/.github/scripts/repo_checks.py bots

      - name: Validate proposed policies with every engine revision a caller pins
        # Callers pick up policy changes immediately but engine changes only when
        # re-pinned. Each caller's pin is read from its own default branch, so a
        # policy change cannot break a caller that nobody remembered to record.
        run: |
          set -euo pipefail
          git clone --quiet --bare https://github.com/dashpay/stale_prs_are_bad central.git
          repos=$(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('proposed/policies/repositories.json'))['repositories']))")
          declare -A pins=()
          # Do not hide a discovery failure in process substitution: an empty
          # pin list would incorrectly pass the policy compatibility gate.
          python3 proposed/.github/scripts/repo_checks.py pins > caller-pins.txt
          while read -r repo sha; do
            if ! git -C central.git merge-base --is-ancestor "$sha" master 2>/dev/null; then
              echo "::error::$repo pins $sha, which is not reachable from master; policy compatibility cannot be verified"
              exit 1
            fi
            pins["$sha"]="${pins[$sha]:-}$repo "
          done < caller-pins.txt
          for sha in "${!pins[@]}"; do
            echo "engine $sha is pinned by: ${pins[$sha]}"
            git clone --quiet --no-checkout https://github.com/dashpay/stale_prs_are_bad "engine-$sha"
            git -C "engine-$sha" checkout --quiet "$sha"
            for repo in $repos; do
              (cd "engine-$sha" && python3 -m pr_review.main validate --repo "$repo" \
                 --policies-root "$GITHUB_WORKSPACE/proposed/policies" --repository-root "$GITHUB_WORKSPACE/trees/${repo#*/}")
            done
          done
      - name: Lint workflows and generated caller workflows
        run: |
          mkdir -p /tmp/actionlint-bin
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash | bash -s 1.7.7 /tmp/actionlint-bin # v1.7.7
          # actionlint 1.7.7 predates job.workflow_sha/ref and concurrency.queue.
          # The bootstrap tests verify these documented contexts and reject
          # missing values; never suppress the nonexistent github.job_workflow_sha.
          /tmp/actionlint-bin/actionlint -ignore 'property "workflow_(sha|ref)" is not defined' \
            -ignore 'unexpected key "queue" for "concurrency" section' proposed/.github/workflows/*.yml
          find packets -name '*.yml' -exec /tmp/actionlint-bin/actionlint {} +
