name: PR Hygiene

on:
  schedule:
    # Every 6 hours at the top of the hour: 00, 06, 12, 18 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render the report as a run artifact only; push nothing and skip Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Don't run analyze and publish for the same repo simultaneously.
  group: pr-hygiene
  cancel-in-progress: false

jobs:
  analyze:
    name: Generate report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # push the regenerated report to the data branch
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Generated output lives on the `data` branch so `master` can stay
      # protected and human-only. The binary reads and writes cwd-relative
      # paths (.pr-hygiene/, the report), so it runs from inside this checkout.
      - name: Checkout data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: data
          path: data

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build analyzer (release)
        run: cargo build --release --locked

      - name: List governed repositories
        id: registry
        run: echo "names=$(python3 -c "import json; print(','.join(e['repository'].split('/')[1] for e in json.load(open('policies/repositories.json'))['repositories']))")" >> "$GITHUB_OUTPUT"

      # The review engine checks collaborator permissions on each governed
      # repository, which this repository's own token cannot read. Without the
      # App the export step is skipped and the board reports every repository
      # as "engine state unavailable".
      - name: Create selected-repository read token
        id: app
        if: vars.PR_REVIEW_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PR_REVIEW_APP_ID }}
          private-key: ${{ secrets.PR_REVIEW_APP_PRIVATE_KEY }}
          owner: dashpay
          repositories: ${{ steps.registry.outputs.names }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-metadata: read

      # `report` has no write path at all. A repository whose export fails
      # simply has no file, which the analyzer renders as unavailable.
      - name: Export review-engine state per repository
        if: steps.app.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          mkdir -p policy-state
          status=0
          for repo in $(python3 -c "import json; print(' '.join(e['repository'] for e in json.load(open('policies/repositories.json'))['repositories']))"); do
            if ! python3 -m pr_review.main report --repo "$repo" --format json > "policy-state/${repo#*/}.json"; then
              echo "::warning::engine state export failed for $repo"
              rm -f "policy-state/${repo#*/}.json"
              status=1
            fi
          done
          exit "$status"

      - name: Run analyzer
        if: ${{ !inputs.dry_run }}
        working-directory: data
        env:
          # The App token reads every governed repository; the job token can
          # only read public ones.
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ../target/release/pr-hygiene --config ../.pr-hygiene.yml --policies-root ../policies --policy-state ../policy-state --out index.md

      - name: Render report without writing anything
        if: ${{ inputs.dry_run }}
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ../target/release/pr-hygiene --config ../.pr-hygiene.yml --policies-root ../policies --policy-state ../policy-state --dry-run > ../dry-run-index.md

      - name: Upload dry-run report
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-report
          path: dry-run-index.md
          retention-days: 7

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        working-directory: data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md .pr-hygiene/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(pr-hygiene): nightly snapshot"
          git push origin HEAD:data

  publish:
    name: Publish to Pages
    needs: analyze
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write          # deploy to GitHub Pages
      id-token: write       # OIDC for actions/deploy-pages
    environment:
      # Lets the run page link directly to the deployed URL.
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pull the data branch AFTER the analyze job's push so we publish the fresh report.
      - name: Checkout data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: data
          path: data
          persist-credentials: false

      - name: Assemble site
        run: cp data/index.md docs/index.md

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Enables Pages on the repo if it isn't already enabled. Idempotent.
          enablement: true

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
