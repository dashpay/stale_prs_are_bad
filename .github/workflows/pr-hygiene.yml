name: PR Hygiene

on:
  schedule:
    # Every 6 hours at the top of the hour: 00, 06, 12, 18 UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write       # push the regenerated report to the data branch
  pull-requests: write  # label PRs on the *target* repo (needs PAT — see README)
  pages: write          # deploy to GitHub Pages
  id-token: write       # OIDC for actions/deploy-pages

concurrency:
  # Don't run analyze and publish for the same repo simultaneously.
  group: pr-hygiene
  cancel-in-progress: false

jobs:
  analyze:
    name: Generate report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Generated output lives on the `data` branch so `master` can stay
      # protected and human-only. The binary reads and writes cwd-relative
      # paths (.pr-hygiene/, the report), so it runs from inside this checkout.
      - name: Checkout data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: data
          path: data

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build analyzer (release)
        run: cargo build --release

      - name: Run analyzer
        working-directory: data
        env:
          # PR_HYGIENE_TOKEN, if set, must be a PAT or fine-grained token with
          # `contents: read` and `pull-requests: write` on the *target* repo.
          # Falls back to GITHUB_TOKEN, which can read public PRs on other repos
          # but cannot label them (see README).
          GITHUB_TOKEN: ${{ secrets.PR_HYGIENE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: ../target/release/pr-hygiene --config ../.pr-hygiene.yml --out index.md

      - name: Commit changes
        working-directory: data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md .pr-hygiene/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(pr-hygiene): nightly snapshot"
          git push origin HEAD:data

  publish:
    name: Publish to Pages
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      # Lets the run page link directly to the deployed URL.
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pull the data branch AFTER the analyze job's push so we publish the fresh report.
      - name: Checkout data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: data
          path: data
          persist-credentials: false

      - name: Assemble site
        run: cp data/index.md docs/index.md

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Enables Pages on the repo if it isn't already enabled. Idempotent.
          enablement: true

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
